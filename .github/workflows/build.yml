name: Build

# Verifica reale dei tre pacchetti installabili: better-sqlite3 e electron-builder
# devono girare sull'OS di destinazione (il target mac, in particolare, non si
# puo' produrre su un host non-macOS). Ogni job compila sul proprio runner
# nativo invece di tentare una cross-compilazione da Windows.
#
# Questa istanza GHES non offre runner ospitati da GitHub: servono tre runner
# self-hosted, uno per OS, registrati su Settings > Actions > Runners > New
# self-hosted runner (repo o org). Ogni runner riceve in automatico le
# etichette "self-hosted", il proprio OS ("Windows" | "macOS" | "Linux") e
# l'architettura ("X64" | "ARM64"): non serve assegnare etichette custom,
# basta registrarne uno per piattaforma perche' i `runs_on` sotto trovino
# match. Prerequisiti da installare a mano sulla macchina del runner (non
# gestiti dalla pipeline, a differenza dei runner ospitati da GitHub):
#   - Windows: Visual Studio Build Tools (workload "Desktop development with
#     C++") + Python 3, per compilare il native addon better-sqlite3.
#   - macOS: Xcode Command Line Tools (`xcode-select --install`).
#   - Linux: build-essential + python3, e sudo senza password per l'utente
#     del runner (serve al passo che installa libfuse2 piu' sotto).
# Node lo installa il passo actions/setup-node: non va preinstallato.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runs_on: [self-hosted, Windows, X64]
            build_script: build:win
          - platform: macos
            runs_on: [self-hosted, macOS]
            build_script: build:mac
          - platform: linux
            runs_on: [self-hosted, Linux, X64]
            build_script: build:linux
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run rebuild:native

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run selfcheck

      # electron-builder scarica appimagetool come AppImage: senza FUSE non
      # riesce ad auto-estrarsi. Richiede sudo senza password sul runner.
      - if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2

      - run: npm run ${{ matrix.build_script }}
        env:
          # Nessun certificato di firma codice e' configurato in questo repo:
          # senza questa variabile electron-builder tenta comunque la ricerca
          # di un'identita' di firma su macOS e puo' fallire la build.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-telematico-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 14
